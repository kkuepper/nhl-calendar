name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * *' # 05:17 ET — overnight broadcaster changes
    - cron: '17 21 * * *' # 16:17 ET — before evening puck drop
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch schedule from the NHL API
        run: node scripts/fetch-data.mjs

      # Committing changed data keeps a history of broadcaster changes and keeps
      # the repo "active", so GitHub doesn't disable the schedule after 60 days.
      - name: Commit data if it changed
        run: |
          if [ -z "$(git status --porcelain -- site/data)" ]; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update schedule data"
            git pull --rebase
            git push
          fi

      # Generated from schedule.json on every deploy; not committed.
      - name: Build calendar feeds
        run: node scripts/build-calendars.mjs

      # Sitemap, robots.txt, and prerendered team pages. Rewritten every deploy
      # so new teams and game lists ship with the schedule.
      - name: Build sitemap and prerendered pages
        run: node scripts/build-seo.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
